<svg xmlns="http://www.w3.org/2000/svg" width="340" height="144" viewBox="0 0 340 144" role="img" aria-label="Most used languages">
  <style>
    text { font-family: -apple-system, BlinkMacSystemFont, "Segoe UI", Ubuntu, "Helvetica Neue", sans-serif; }
    .title { font-size: 18px; font-weight: 600; fill: #70a5fd; }
    .label { font-size: 14px; fill: #38bdae; }
    .label { font-size: 12px; }
  </style>
  <rect x="0.5" y="0.5" width="339" height="143" rx="6" fill="#1a1b27" stroke="#2a2b3d"/>
  <text class="title" x="25" y="34">Most Used Languages</text>
  <mask id="bar"><rect x="25" y="50" width="290" height="8" rx="4" fill="#fff"/></mask>
  <g mask="url(#bar)">
