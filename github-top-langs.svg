  <g transform="translate(170.00 100)">
    <circle cx="5" cy="8" r="5" fill="#f1e05a"/>
    <text class="label" x="16" y="12">JavaScript 11.78%</text>
  </g>
  <g transform="translate(25.00 122)">
    <circle cx="5" cy="8" r="5" fill="#00B4AB"/>
    <text class="label" x="16" y="12">Dart 7.40%</text>
  </g>
  <g transform="translate(170.00 122)">
    <circle cx="5" cy="8" r="5" fill="#c6538c"/>
