    <rect x="102.56" y="50" width="63.03" height="8" fill="#3178c6"/>
    <rect x="165.60" y="50" width="48.68" height="8" fill="#e34c26"/>
    <rect x="214.28" y="50" width="34.17" height="8" fill="#f1e05a"/>
    <rect x="248.45" y="50" width="21.45" height="8" fill="#00B4AB"/>
    <rect x="269.90" y="50" width="18.42" height="8" fill="#c6538c"/>
  </g>
  <g transform="translate(25.00 78)">
    <circle cx="5" cy="8" r="5" fill="#3572A5"/>
